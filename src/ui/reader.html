<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PureClip · 素笺</title>
  <link rel="stylesheet" href="reader.css">
  <style id="pc-print-page-rule">@page { margin: 16mm; }</style>
</head>
<body data-theme="paper" data-font="serif">
  <div class="reader-shell">
    <!-- Top Floating Control Bar -->
    <header class="topbar no-print" id="topbar">
      <div class="topbar-group topbar-left">
        <span class="brand">
          <img src="../icons/icon-48.png" alt="" class="brand-icon">
          <span>素笺</span>
        </span>
        <span id="dup-badge" class="dup-badge hidden" title="该网址曾剪藏过"></span>
        <div class="mode-switch" role="group" aria-label="提取范围">
          <button type="button" class="mode-btn" data-mode="article">智能正文</button>
          <button type="button" class="mode-btn" data-mode="picker">框选区域</button>
          <button type="button" class="mode-btn" data-mode="selection">涂黑选区</button>
        </div>
      </div>

      <div class="topbar-group topbar-center">
        <div class="popover-anchor">
          <button type="button" id="btn-style-toggle" class="tool-btn">排版设置 ▾</button>
          <div id="style-popover" class="style-popover hidden">
            <div class="pop-row">
              <span class="pop-label">主题</span>
              <div class="seg-group" id="theme-group">
                <button type="button" class="seg-btn" data-theme="white">纯白省墨</button>
                <button type="button" class="seg-btn" data-theme="paper">素笺护眼</button>
                <button type="button" class="seg-btn" data-theme="dark">夜间深色</button>
              </div>
            </div>
            <div class="pop-row">
              <span class="pop-label">字体</span>
              <div class="seg-group" id="font-group">
                <button type="button" class="seg-btn" data-font="sans">黑体</button>
                <button type="button" class="seg-btn" data-font="serif">宋体</button>
                <button type="button" class="seg-btn" data-font="kai">楷体</button>
              </div>
            </div>
            <div class="pop-row">
              <span class="pop-label">字号</span>
              <div class="stepper">
                <button type="button" id="btn-font-dec">A-</button>
                <span id="val-font-size">18px</span>
                <button type="button" id="btn-font-inc">A+</button>
              </div>
            </div>
            <div class="pop-row">
              <span class="pop-label">行距</span>
              <div class="stepper">
                <button type="button" id="btn-lh-dec">-</button>
                <span id="val-line-height">1.8</span>
                <button type="button" id="btn-lh-inc">+</button>
              </div>
            </div>
            <div class="pop-row">
              <span class="pop-label">页边距</span>
              <div class="seg-group" id="margin-group">
                <button type="button" class="seg-btn" data-margin="compact">紧凑</button>
                <button type="button" class="seg-btn" data-margin="normal">标准</button>
                <button type="button" class="seg-btn" data-margin="wide">宽裕</button>
              </div>
            </div>
            <div class="pop-toggles">
              <label class="toggle-item"><input type="checkbox" id="opt-images" checked> 显示配图</label>
              <label class="toggle-item"><input type="checkbox" id="opt-code" checked> 显示代码块</label>
              <label class="toggle-item"><input type="checkbox" id="opt-meta" checked> 原文溯源头</label>
            </div>
          </div>
        </div>
      </div>

      <div class="topbar-group topbar-right">
        <select id="format-select" class="tool-select" title="导出格式">
          <option value="html">离线 HTML</option>
          <option value="md">Markdown</option>
          <option value="pdf">PDF 打印</option>
        </select>

        <div class="cat-picker">
          <select id="category-select" class="tool-select" title="保存分类目录"></select>
          <button type="button" id="btn-new-cat" class="icon-btn" title="新建分类子文件夹">+</button>
        </div>

        <button type="button" id="btn-save" class="primary-btn">归档保存</button>
        <button type="button" id="btn-save-as" class="tool-btn" title="手选路径另存为">另存为…</button>
        <button type="button" id="btn-manager" class="tool-btn" title="历史记录与本地总目录设置">历史/目录</button>
        <button type="button" id="btn-close" class="close-btn" title="关闭 (Esc)">✕</button>
      </div>
    </header>

    <div id="toast-bar" class="toast-bar no-print hidden"></div>

    <!-- Scrollable Paper Area -->
    <main class="paper-scroll" id="paper-scroll">
      <article class="paper-sheet" id="paper-sheet" data-margin="normal">
        <div class="filename-strip no-print">
          <label for="filename-input">保存文件名：</label>
          <input type="text" id="filename-input" class="filename-input" spellcheck="false">
        </div>

        <h1 id="article-title" class="article-title" contenteditable="true" spellcheck="false">正在提取网页内容…</h1>

        <header id="meta-header" class="meta-header">
          <div class="meta-line" id="meta-line"></div>
          <div class="meta-url-line" id="meta-url-line"></div>
        </header>

        <section id="note-wrapper" class="note-wrapper is-empty-note">
          <div class="note-label">素笺备注</div>
          <textarea id="note-input" class="note-input no-print" rows="1" placeholder="写下你的个人摘要或批注（留空则在导出和打印时自动隐藏）…"></textarea>
          <div id="note-print-mirror" class="note-print-mirror print-only"></div>
        </section>

        <div id="article-body" class="article-body"></div>
      </article>
    </main>
  </div>

  <!-- Selection Highlighter Floating Toolbar -->
  <div id="hl-toolbar" class="hl-toolbar no-print hidden" role="toolbar" aria-label="荧光笔高亮">
    <button type="button" class="hl-dot amber" data-color="amber" title="琥珀黄高亮"></button>
    <button type="button" class="hl-dot mint" data-color="mint" title="竹青绿高亮"></button>
    <button type="button" class="hl-dot sky" data-color="sky" title="晴空蓝高亮"></button>
    <button type="button" id="hl-clear" class="hl-clear-btn">清除</button>
  </div>

  <!-- New Category Dialog -->
  <dialog id="new-cat-dialog" class="pc-dialog no-print">
    <form method="dialog" id="new-cat-form">
      <h3>新建分类子文件夹</h3>
      <p class="dialog-hint">支持层级路径，例如：<code>技术研发/前端</code></p>
      <input type="text" id="new-cat-input" class="dialog-input" placeholder="输入分类名称…" required>
      <div class="dialog-actions">
        <button type="button" id="new-cat-cancel" class="tool-btn">取消</button>
        <button type="submit" class="primary-btn">创建并使用</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="reader.js"></script>
</body>
</html>
