<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PureClip · 素笺 — 分类目录与剪藏历史</title>
  <link rel="stylesheet" href="manager.css">
</head>
<body>
  <div id="bridge-view" class="bridge-card hidden">
    <img src="../icons/icon-128.png" alt="" class="bridge-logo">
    <h2>素笺 · 本地目录写入确认</h2>
    <p id="bridge-status">正在准备写入已授权的本地总目录…</p>
    <div class="bridge-actions">
      <button type="button" id="btn-bridge-grant" class="primary-btn hidden">确认授权并保存文件</button>
      <button type="button" id="btn-bridge-fallback" class="tool-btn hidden">改存到系统下载目录</button>
    </div>
  </div>

  <div id="manager-view" class="container">
    <header class="header">
      <div class="header-brand">
        <img src="../icons/icon-48.png" alt="" class="logo">
        <div>
          <h1>PureClip · 素笺</h1>
          <p class="subtitle">本地目录归档、分类管理与网页剪藏历史库</p>
        </div>
      </div>
      <div id="toast" class="toast hidden"></div>
    </header>

    <!-- Storage Directory Binding -->
    <section class="card">
      <h2>本地归档目录设置</h2>
      <div id="chromium-fs-panel" class="fs-panel hidden">
        <div class="fs-status-row">
          <div>
            <span class="label">当前本地总目录：</span>
            <strong id="fs-dir-name">未绑定（使用浏览器默认下载目录）</strong>
            <span id="fs-perm-badge" class="badge"></span>
          </div>
          <div class="btn-group">
            <button type="button" id="btn-pick-dir" class="primary-btn">绑定 / 更换本地总目录</button>
            <button type="button" id="btn-regrant-dir" class="tool-btn hidden">恢复写入权限</button>
            <button type="button" id="btn-sync-dirs" class="tool-btn hidden">同步磁盘子目录</button>
            <button type="button" id="btn-unbind-dir" class="tool-btn hidden">改回下载目录</button>
          </div>
        </div>
        <p class="hint">绑定一次后，在阅读页点击「归档保存」即可直接将 HTML 与 Markdown（含 <code>assets/</code> 配图）写入对应分类子文件夹。</p>
      </div>

      <div id="firefox-fs-panel" class="fs-panel hidden">
        <div class="fs-status-row">
          <div class="inline-form">
            <label for="archive-root-input" class="label">下载目录归档根文件夹名称：</label>
            <input type="text" id="archive-root-input" class="input" value="PureClip_素笺">
            <button type="button" id="btn-save-root-name" class="primary-btn">保存名称</button>
          </div>
          <div class="btn-group">
            <button type="button" id="btn-fx-host-perm" class="tool-btn">授权全站防盗链图片补抓</button>
          </div>
        </div>
        <p class="hint">Firefox 会将文章按分类自动保存至默认下载目录的 <code>&lt;根文件夹&gt;/&lt;分类名&gt;/</code> 下；使用「另存为…」可自由选择任意磁盘位置。</p>
      </div>
    </section>

    <!-- Category Management -->
    <section class="card">
      <h2>分类子文件夹管理</h2>
      <form id="cat-form" class="inline-form">
        <input type="text" id="cat-input" class="input" placeholder="输入新分类名称（支持如 技术研发/前端）…" required>
        <button type="submit" class="primary-btn">添加分类</button>
      </form>
      <div id="cat-list" class="cat-list"></div>
    </section>

    <!-- Clip History -->
    <section class="card">
      <div class="history-head">
        <h2>剪藏历史库 <span id="history-count" class="count-pill">0</span></h2>
        <div class="history-tools">
          <input type="search" id="search-input" class="input" placeholder="搜索标题、网址或备注…">
          <select id="filter-category" class="select">
            <option value="">全部分类</option>
          </select>
          <select id="filter-format" class="select">
            <option value="">全部格式</option>
            <option value="html">HTML</option>
            <option value="md">Markdown</option>
            <option value="pdf">PDF</option>
          </select>
          <button type="button" id="btn-export-json" class="tool-btn">导出记录 JSON</button>
          <button type="button" id="btn-clear-history" class="danger-btn">清空历史</button>
        </div>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>
  </div>

  <script type="module" src="manager.js"></script>
</body>
</html>
